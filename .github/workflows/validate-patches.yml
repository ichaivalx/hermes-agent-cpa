name: Validate Hermes patch set

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release.yml"
      - ".github/workflows/validate-patches.yml"
      - "patches/**"
      - "scripts/prepare-source.sh"
      - "scripts/smoke_test.py"
      - "upstream.env"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out build repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare patched Hermes source
        shell: bash
        run: ./scripts/prepare-source.sh "${GITHUB_WORKSPACE}/.build/hermes-agent"

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: |
            .build/hermes-agent/pyproject.toml
            .build/hermes-agent/uv.lock

      - name: Install source test environment
        shell: bash
        run: |
          set -euo pipefail
          uv python install 3.11
          cd .build/hermes-agent
          uv sync --locked --python 3.11 --extra dev --extra messaging

      - name: Test and lint patched behavior
        shell: bash
        run: |
          set -euo pipefail
          cd .build/hermes-agent
          scripts/run_tests.sh \
            tests/gateway/test_leftover_steer_carry.py \
            tests/gateway/test_qqbot.py \
            tests/gateway/test_qq_direct_delivery.py \
            tests/gateway/test_qq_media_mention_and_ordering.py \
            tests/gateway/test_session_stall_watchdog.py \
            tests/tools/test_qq_group_files_tool.py \
            --file-timeout 600
          scripts/run_tests.sh \
            tests/test_hermes_state.py \
            -k TestObservedPlatformMessageDiscard \
            --file-timeout 600
          scripts/run_tests.sh \
            tests/gateway/test_gateway_silence_tokens.py \
            tests/gateway/test_stream_consumer_silence.py \
            --file-timeout 600
          scripts/run_tests.sh \
            tests/plugins/image_gen/test_openai_provider.py \
            --file-timeout 600
          scripts/run_tests.sh \
            tests/agent/test_steer_channel_note.py \
            --file-timeout 600
          scripts/run_tests.sh \
            tests/agent/test_tool_result_image_transport.py \
            tests/tools/test_vision_native_fast_path.py \
            tests/tools/test_vision_region.py \
            tests/tools/test_vision_tools.py \
            --file-timeout 600
          uv run ruff check \
            acp_adapter/tools.py \
            agent/agent_init.py \
            agent/bedrock_adapter.py \
            agent/context_compressor.py \
            agent/display.py \
            agent/prompt_builder.py \
            agent/system_prompt.py \
            gateway/platforms/base.py \
            gateway/platforms/qqbot/adapter.py \
            gateway/platforms/qqbot/group_workspace.py \
            gateway/run.py \
            gateway/session.py \
            gateway/session_state.py \
            gateway/turn_context.py \
            hermes_cli/config_defaults.py \
            hermes_cli/main.py \
            hermes_cli/web_server.py \
            hermes_state.py \
            plugins/image_gen/openai/__init__.py \
            tools/qq_group_files_tool.py \
            tools/qq_group_send_tool.py \
            tools/vision_tools.py \
            tests/agent/test_tool_result_image_transport.py \
            tests/gateway/test_leftover_steer_carry.py \
            tests/gateway/test_qqbot.py \
            tests/gateway/test_qq_direct_delivery.py \
            tests/gateway/test_qq_media_mention_and_ordering.py \
            tests/gateway/test_session_stall_watchdog.py \
            tests/tools/test_qq_group_files_tool.py \
            tests/tools/test_vision_native_fast_path.py \
            tests/tools/test_vision_region.py \
            tests/tools/test_vision_tools.py \
            tests/plugins/image_gen/test_openai_provider.py \
            tests/agent/test_steer_channel_note.py \
            tests/test_hermes_state.py
